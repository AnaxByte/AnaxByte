<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1120" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B12"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#07141A"/>
    </linearGradient>
    <linearGradient id="accent" x1="340" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <g stroke="#38BDF8" stroke-opacity="0.32" stroke-width="1.5">
    <path d="M0 82H180L230 132H330"/>
    <path d="M0 252H145L210 187H330"/>
    <path d="M870 80H1015L1070 135H1200"/>
    <path d="M870 242H1000L1060 182H1200"/>
  </g>

  <g fill="#38BDF8" filter="url(#glow)">
    <circle cx="180" cy="82" r="4">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="187" r="4">
      <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1015" cy="80" r="4">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="242" r="4">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="145" text-anchor="middle" fill="url(#accent)"
        font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="0">
    ANAXBYTE
  </text>
  <text x="600" y="194" text-anchor="middle" fill="#CBD5E1"
        font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="0">
    BUILDING INTELLIGENT SYSTEMS, ONE BYTE AT A TIME
  </text>

  <rect x="470" y="224" width="260" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="width" values="80;260;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="560;470;560" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
